# Search queries for LLM efficient fine-tuning survey
# Date range: 2019-01-01 to 2026-06-30
# Protocol version: 1.1
# Status: Locked — Protocol v1.1 amendment (post v1.0 execution evidence)
# See protocol/CHANGELOG.md. Do not alter without a further version bump.

meta:
  protocol_version: "1.1"
  supersedes: "1.0"
  date_start: "2019-01-01"
  date_end: "2026-06-30"
  arxiv_categories:
    - cs.LG
    - cs.CL
    - cs.AI
    - cs.DC
  max_results_per_query: 200
  manual_relevance_cap: 50
  date_slices:
    - "2019"
    - "2020"
    - "2021"
    - "2022"
    - "2023"
    - "2024"
    - "2025"
    - "2026-H1"
  notes: >-
    Boolean `queries` are for arXiv and manual sources (Scholar/IEEE/ACM).
    `s2_queries` are semantically equivalent keyword formulations for
    Semantic Scholar (not identical strings). OpenReview discovery queries
    are not re-run under v1.1; OpenReview is used for venue checks.

blocks:
  - id: B1_peft
    name: Parameter-Efficient Fine-Tuning
    queries:
      - '"parameter-efficient fine-tuning" AND "large language model"'
      - '"low-rank adaptation" AND (LoRA OR AdaLoRA OR DoRA OR VeRA)'
      - '"adapter" AND "transformer" AND "fine-tuning" AND efficient'
      - '"prompt tuning" OR "prefix tuning" OR "BitFit"'
      - '"PEFT" AND survey'
    s2_queries:
      - 'parameter-efficient fine-tuning large language models'
      - 'low-rank adaptation LoRA language model'
      - 'adapter modules transformer parameter efficient'
      - 'prompt tuning prefix tuning soft prompts'
      - 'parameter-efficient fine-tuning survey'

  - id: B2_quantization
    name: Quantization
    queries:
      - '"quantization" AND "large language model" AND "fine-tuning"'
      - '(GPTQ OR AWQ OR SmoothQuant OR QLoRA) AND quantization'
      - '"post-training quantization" AND LLM'
      - '"quantization-aware training" AND transformer'
      - '"low-bit" AND "large language model" AND survey'
    s2_queries:
      - 'quantization large language model fine-tuning'
      - 'post-training quantization LLM GPTQ AWQ'
      - 'QLoRA quantized low-rank adaptation'
      - 'quantization-aware training transformer'
      - 'low-bit quantization large language models survey'

  - id: B3_memory
    name: Memory Optimization
    queries:
      - '"gradient checkpointing" AND training AND memory'
      - '"FlashAttention" OR "memory-efficient attention"'
      # CORRECTED in v1.1 — explicit parentheses (defect 1)
      - '("ZeRO" OR "DeepSpeed" OR "offloading") AND ("model training" OR "large language model")'
      - '"memory optimization" AND "large language model" AND training'
    s2_queries:
      - 'gradient checkpointing activation memory training'
      - 'FlashAttention memory efficient attention'
      - 'ZeRO DeepSpeed offloading distributed training memory'
      - 'memory optimization large language model training'

  - id: B4_federated
    name: Distributed and Federated
    queries:
      - '"federated learning" AND "large language model"'
      - '"federated" AND (LoRA OR "parameter-efficient")'
      - '"distributed training" AND "language model" AND communication'
      - '"federated fine-tuning" AND heterogeneity'
    s2_queries:
      - 'federated learning large language models'
      - 'federated LoRA parameter efficient fine-tuning'
      - 'communication efficient distributed language model training'
      - 'federated fine-tuning data heterogeneity non-IID'
